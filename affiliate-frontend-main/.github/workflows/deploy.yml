name: CI / Deploy

# CI runs on every PR to main and on pushes to main (build gate).
# Deploy is MANUAL: Actions -> "CI / Deploy" -> "Run workflow" (write access only).
# Merging to main does NOT auto-deploy — you ship deliberately with the button.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:        # the manual "Run workflow" deploy trigger

# Never run two deploys at once; queue them instead of cancelling a live one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # Full Next build (also runs TypeScript) — the same gate we run locally.
      # NEXT_PUBLIC_* are unset here; that only affects the bundle's baked URLs,
      # not build validity. The real prod build happens on the server via deploy.sh.
      - run: npm run build

  deploy:
    name: Deploy to production
    needs: ci                                     # build must pass in this run before we ship
    if: github.event_name == 'workflow_dispatch'  # deploy ONLY via the manual button, never on push/PR
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (runs ./deploy.sh on the server)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'cd /var/www/ambassador-frontend && ./deploy.sh'
