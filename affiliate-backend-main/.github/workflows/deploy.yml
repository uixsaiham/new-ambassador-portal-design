name: CI / Deploy

# CI runs on every PR to main and on pushes to main (build gate).
# Deploy is MANUAL: Actions -> "CI / Deploy" -> "Run workflow" (write access only).
# Merging to main does NOT auto-deploy — you ship deliberately with the button.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:        # the manual "Run workflow" deploy trigger

# Never run two deploys at once; queue them instead of cancelling a live one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Syntax + import check
        env:
          # Contains "pytest" so app.main skips create_all()/migrations on import.
          PYTEST_CURRENT_TEST: "gha-ci-pytest"
        run: |
          python -m compileall -q app
          python -c "import app.main"

  deploy:
    name: Deploy to production
    needs: ci                                     # build must pass in this run before we ship
    if: github.event_name == 'workflow_dispatch'  # deploy ONLY via the manual button, never on push/PR
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (runs ./deploy.sh on the server)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'cd /var/www/ambassador-backend && ./deploy.sh'
